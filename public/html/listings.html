<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/listings.css">
    <title>Boliger</title>
</head>
<body>
<header>
    <nav>
        <a href="/" class="logo">Bedrebolig</a>
        <div class="nav-links">
            <a href="/boligere">Alle boliger</a>
            <a href="/favoritter">💖 Favoritter</a>
            <div id="userMenuListings"></div>
        </div>
    </nav>
</header>

<div class="filters">
    <input type="text" id="postalCodeFilter" placeholder="Postnummer">
    <input type="text" id="cityFilter" placeholder="By">

    <!-- NYT: Type filter -->
    <select id="typeFilter">
        <option value="">Alle typer</option>
        <option value="Lejlighed">Lejlighed</option>
        <option value="Villa">Villa</option>
        <option value="Rækkehus">Rækkehus</option>
        <option value="Ejerlejlighed">Ejerlejlighed</option>
        <option value="Andelsbolig">Andelsbolig</option>
        <option value="Fritidshus">Fritidshus</option>
        <option value="Landejendom">Landejendom</option>
        <option value="Villalejlighed">Villalejlighed</option>
    </select>

    <input type="number" id="minPrice" placeholder="Min pris">
    <input type="number" id="maxPrice" placeholder="Max pris">
    <input type="number" id="minRooms" placeholder="Min værelser">
    <input type="number" id="maxRooms" placeholder="Max værelser">

    <button id="applyFilters">Anvend filtre</button>
</div>
<div id="postMessage" class="postMessage">
</div>
<div class="listing-holder" id="listing-holder">
<h1>Boliger</h1>
        <div class="listing-item-image">
            <div class="fakeImg"></div>
        </div>

</div>


<script src="/js/listings.js"></script>
</body>
</html>
