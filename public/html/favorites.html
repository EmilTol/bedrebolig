<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/shared.css">
    <link rel="stylesheet" href="/css/favorites.css">
    <title>Mine Favoritter - Bedrebolig</title>
</head>
<body>
<header>
    <nav>
        <a href="/" class="logo">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            Bedrebolig
        </a>
        <div class="nav-links">
            <a href="/boligere">Se alle boliger</a>
            <div id="userMenuFavorites" class="user-menu"></div>
        </div>
    </nav>
</header>

<div class="container">
    <h1>Mine Favoritter</h1>

    <!-- Vises når der er favoritter -->
    <div id="favorites-container" class="favorites-grid"></div>

    <!-- Vises når der IKKE er favoritter -->
    <div id="empty-state" style="display: none;">
        <p>Du har ingen favoritter endnu</p>
        <a href="/boligere" class="btn-browse">Find boliger</a>
    </div>

    <!-- Fejlbesked -->
    <div id="error-message" style="display: none;"></div>
</div>

<script src="/js/favorites.js"></script>
</body>
</html>
